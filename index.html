<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denises Wunschliste</title>
<meta name="description" content="Denises Wunschliste – wer etwas schenkt, hakt es hier ab, damit niemand doppelt kauft.">
<meta name="theme-color" content="#f4e5db">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap">
<link rel="stylesheet" href="css/style.css?v=29">
</head>
<body id="top">

<section class="hero">
  <!-- Wenn assets/hero.jpg vorhanden ist, liegt das Foto hier oben auf.
       Fehlt die Datei, bleibt diese Ebene leer und die gezeichnete
       Szene darunter ist das Kopfbild. -->
  <div class="hero-photo" aria-hidden="true"></div>

  <div class="hero-scene" aria-hidden="true">
    <svg viewBox="0 0 1440 620" preserveAspectRatio="xMidYMax slice" role="presentation" focusable="false">
      <defs>
        <linearGradient id="airG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"   stop-color="#fbf3ec"/>
          <stop offset=".38" stop-color="#f4e5db"/>
          <stop offset=".72" stop-color="#e9d3c6"/>
          <stop offset="1"   stop-color="#dfc4b5"/>
        </linearGradient>
        <radialGradient id="lightG" cx=".22" cy=".16" r=".72">
          <stop offset="0"   stop-color="#fffaf3" stop-opacity=".95"/>
          <stop offset=".42" stop-color="#fdf1e6" stop-opacity=".45"/>
          <stop offset="1"   stop-color="#fdf1e6" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="tableG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"   stop-color="#e0c7b4"/>
          <stop offset=".5"  stop-color="#d6b9a5"/>
          <stop offset="1"   stop-color="#c4a28c"/>
        </linearGradient>
        <linearGradient id="clothG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0"   stop-color="#eccfc7"/>
          <stop offset=".55" stop-color="#dcb4ab"/>
          <stop offset="1"   stop-color="#c2908a"/>
        </linearGradient>
        <linearGradient id="clothG2" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0"   stop-color="#e8d8c4"/>
          <stop offset="1"   stop-color="#d0b596"/>
        </linearGradient>
        <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0"   stop-color="#e6d3a6" stop-opacity="0"/>
          <stop offset=".5"  stop-color="#c9a86a"/>
          <stop offset="1"   stop-color="#e6d3a6" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="vignetteG" cx=".5" cy=".42" r=".8">
          <stop offset=".45" stop-color="#000" stop-opacity="0"/>
          <stop offset="1"   stop-color="#6b4c3c" stop-opacity=".22"/>
        </radialGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
        <filter id="softer"><feGaussianBlur stdDeviation="18"/></filter>
        <filter id="haze"><feGaussianBlur stdDeviation="34"/></filter>
      </defs>

      <!-- Warme Luft und ein Lichteinfall von links oben, wie im Foto -->
      <rect width="1440" height="620" fill="url(#airG)"/>
      <rect width="1440" height="620" fill="url(#lightG)"/>

      <!-- Bokeh: unscharfe Lichtpunkte in der Tiefe -->
      <g filter="url(#haze)" opacity=".5">
        <circle cx="250" cy="120" r="86"  fill="#fff6ea"/>
        <circle cx="470" cy="70"  r="54"  fill="#fdeadf"/>
        <circle cx="1180" cy="130" r="98" fill="#f4dcd2"/>
        <circle cx="960" cy="60"  r="46"  fill="#fff3e6"/>
      </g>

      <!-- Tischkante: der Horizont dieser Szene -->
      <path d="M0 318 C 300 300, 620 306, 900 300 C 1130 295, 1300 304, 1440 298 L1440 620 L0 620 Z"
            fill="url(#tableG)"/>
      <path d="M0 318 C 300 300, 620 306, 900 300 C 1130 295, 1300 304, 1440 298"
            fill="none" stroke="#fdf3ea" stroke-width="2.5" opacity=".55"/>

      <!-- Weicher Stoff, links über die Kante gelegt -->
      <g filter="url(#soft)" opacity=".95">
        <path d="M-40 372 C 120 336, 250 402, 400 372 C 520 348, 600 392, 680 380
                 L 700 620 L -40 620 Z" fill="url(#clothG2)"/>
      </g>
      <g filter="url(#soft)" opacity=".9">
        <path d="M-40 452 C 140 414, 300 476, 470 448 C 590 428, 660 466, 740 456
                 L 760 620 L -40 620 Z" fill="url(#clothG)"/>
      </g>

      <!-- Falten: ein paar helle Grate, mehr braucht es nicht -->
      <g stroke="#fff6ee" stroke-linecap="round" fill="none" opacity=".4" filter="url(#soft)">
        <path d="M60 500 C 180 470, 300 520, 420 496" stroke-width="7"/>
        <path d="M40 556 C 200 528, 340 572, 500 548" stroke-width="6"/>
        <path d="M120 424 C 240 400, 330 438, 440 420" stroke-width="5"/>
      </g>

      <!-- Rechts eine gestapelte Decke, warm angeleuchtet -->
      <g opacity=".92">
        <rect x="1040" y="392" width="392" height="54" rx="18" fill="#e0c6ae"/>
        <rect x="1058" y="440" width="374" height="52" rx="18" fill="#d2b298"/>
        <rect x="1030" y="486" width="410" height="56" rx="20" fill="#c09c81"/>
        <g stroke="#fff4e9" stroke-width="2" opacity=".35" fill="none">
          <path d="M1052 418h372M1070 466h356M1042 514h388"/>
        </g>
      </g>

      <!-- Ein Band, das sich über den Tisch legt: die Leitfarbe der Seite -->
      <g class="hero-flag" filter="url(#soft)" opacity=".85">
        <path d="M690 336 C 810 312, 900 372, 1020 346 C 1108 327, 1160 352, 1224 342"
              stroke="#c08d86" stroke-width="22" fill="none" stroke-linecap="round"/>
        <path d="M690 336 C 810 312, 900 372, 1020 346 C 1108 327, 1160 352, 1224 342"
              stroke="#efd7d1" stroke-width="6" fill="none" stroke-linecap="round" opacity=".7"/>
      </g>

      <!-- Zwei Goldfäden als ruhige Horizontale -->
      <rect x="0" y="330" width="1440" height="1.6" fill="url(#goldG)" opacity=".8"/>
      <rect x="0" y="337" width="1440" height="1"   fill="url(#goldG)" opacity=".45"/>

      <!-- Dunst über dem Übergang und eine sehr milde Vignette -->
      <rect x="-40" y="286" width="1520" height="80" fill="#fdf2e8" opacity=".22" filter="url(#softer)"/>
      <rect width="1440" height="620" fill="url(#vignetteG)"/>
    </svg>

    <!-- Feines Korn über der Szene, damit die Verläufe nicht digital wirken -->
    <span class="hero-grain"></span>
  </div>

  <div class="hero-inner">
    <div class="hero-text">
      <h1>Denises Wünsche</h1>
      <p class="lede">Wähle einen Wunsch aus und reserviere ihn mit einem kurzen Passwort.
        Damit kannst du ihn später wieder aufheben. Denise sieht nicht, wer welchen
        Wunsch auswählt.</p>
    </div>
  </div>

  <div class="tartan-band" aria-hidden="true"></div>
</section>

<main class="wrap">

  <div class="adminbar" id="adminbar" hidden>
    <span class="adminbar-label">Admin-Modus</span>
    <div class="adminbar-actions">
      <button class="primary small" id="admin-toggle" type="button">Wunsch hinzufügen</button>
      <button class="ghost small" id="logout" type="button">Abmelden</button>
    </div>
  </div>

  <section class="panel" id="admin-panel" hidden>
    <h2 id="form-heading">Neuer Wunsch</h2>
    <form id="wish-form" autocomplete="off">
      <input type="hidden" id="edit-id">
      <div class="field">
        <label for="f-title">Artikel <span class="req">*</span></label>
        <input id="f-title" name="title" type="text" required maxlength="140" placeholder="z. B. Kaschmirschal, beige">
      </div>
      <div class="row">
        <div class="field">
          <label for="f-price">Preis (ca.) <span class="hint">(€ kommt automatisch)</span></label>
          <input id="f-price" name="price" type="text" maxlength="40" placeholder="49">
        </div>
        <div class="field grow">
          <label for="f-link">Link zum Shop <span class="hint">(Bild wird daraus geholt)</span></label>
          <input id="f-link" name="link" type="url" maxlength="600" placeholder="https://…">
        </div>
      </div>

      <div class="imgstatus" id="image-status" hidden>
        <img id="image-preview" alt="" hidden>
        <span id="image-status-text"></span>
        <button type="button" class="linkish" id="image-manual">Bild selbst angeben</button>
      </div>

      <div class="field">
        <label for="f-note">Bemerkung <span class="hint">(z. B. Größe 86, Farbe rosé)</span></label>
        <input id="f-note" name="note" type="text" maxlength="200" placeholder="Größe 86">
      </div>

      <div class="field" id="image-row" hidden>
        <label for="f-image">Bild-URL <span class="hint">(Rechtsklick aufs Produktbild → „Bildadresse kopieren")</span></label>
        <input id="f-image" name="image_url" type="url" maxlength="600" placeholder="https://…jpg">
      </div>

      <div class="form-actions">
        <button type="submit" class="primary" id="submit-btn">Hinzufügen</button>
        <button type="button" class="ghost" id="cancel-edit" hidden>Abbrechen</button>
        <span class="form-msg" id="form-msg" role="status" aria-live="polite"></span>
      </div>
    </form>
  </section>

  <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>

  <section id="list" class="list" aria-label="Wunschliste"></section>

  <p class="empty" id="empty" hidden>Noch keine Wünsche eingetragen.</p>

  <section class="summary reveal" id="stats" hidden aria-label="Übersicht">
    <div class="stat">
      <span class="stat-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" focusable="false">
          <path d="M3 10h18v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M2.5 6.5h19v3.5h-19z" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 6.5v14.5M12 6.5C10.5 3 8.5 2.5 7.5 3.4S7 6 9 6.5zM12 6.5c1.5-3.5 3.5-4 4.5-3.1S17 6 15 6.5z"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="stat-num" id="stat-total">0</span><span class="stat-label">Gesamt Wünsche</span>
    </div>
    <div class="stat">
      <span class="stat-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" focusable="false">
          <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        </svg>
      </span>
      <span class="stat-num" id="stat-open">0</span><span class="stat-label">Offene Wünsche</span>
    </div>
    <div class="stat">
      <span class="stat-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" focusable="false">
          <circle cx="12" cy="12" r="9" fill="currentColor"/>
          <path d="M7.8 12.3l2.8 2.8 5.6-5.9" fill="none" stroke="#fffdf8" stroke-width="1.9"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="stat-num" id="stat-taken">0</span><span class="stat-label">Vergebene Wünsche</span>
    </div>
  </section>

  <div class="toolbar reveal" id="toolbar" hidden>
    <label class="switch">
      <input type="checkbox" id="hide-taken">
      <span>Vergebene ausblenden</span>
    </label>
  </div>

</main>

<footer>
  <div class="login" id="login">
    <button type="button" class="linkish" id="login-open">Verwalten</button>
    <form id="login-form" hidden autocomplete="off">
      <label class="sr-only" for="login-pw">Passwort</label>
      <input id="login-pw" type="password" placeholder="Passwort" autocomplete="current-password">
      <button type="submit" class="primary small">Anmelden</button>
      <button type="button" class="linkish" id="login-cancel">Abbrechen</button>
      <p class="login-msg" id="login-msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</footer>

<div class="tartan-band" aria-hidden="true"></div>

<script src="js/config.js?v=29"></script>
<script src="js/app.js?v=29"></script>
</body>
</html>
